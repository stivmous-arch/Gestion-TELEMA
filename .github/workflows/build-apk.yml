name: Compiler l'APK Gestion TELEMA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: npm install

      - name: Embarquer le moteur de synchronisation dans l'application (demarrage sans internet)
        run: |
          mkdir -p www/lib
          for f in firebase-app-compat.js firebase-auth-compat.js firebase-firestore-compat.js; do
            curl -fsSL "https://www.gstatic.com/firebasejs/10.13.2/$f" -o "www/lib/$f"
          done

      - name: Ajouter la plateforme Android
        run: npx cap add android
        
      - name: Appliquer le logo TELEMA (icone de l'application et ecran de demarrage)
        run: cp -r android-res/. android/app/src/main/res/
        
      - name: S'assurer que la permission internet est presente (necessaire a la synchronisation)
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser le projet
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Mettre l'APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-TELEMA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
